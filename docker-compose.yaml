x-network-runtime: &network-runtime
  image: magpie-gateway-runtime:local
  build:
    context: ./runtime
    args:
      MIHOMO_IMAGE: ${MIHOMO_IMAGE:-docker.io/metacubex/mihomo:v1.19.24}
  platform: linux/arm64
  cap_drop: [ALL]
  cap_add: [NET_ADMIN]
  restart: unless-stopped
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"

x-magpie: &magpie
  image: ${MAGPIE_IMAGE:?请在 .env 中设置 ARM64 Magpie 镜像}
  platform: linux/arm64
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-resolver: &resolver
  type: bind
  source: ./magpie/resolv.conf
  target: /etc/resolv.conf
  read_only: true
  bind:
    create_host_path: false

services:
  mihomo:
    <<: *network-runtime
    command: [gateway]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    volumes:
      - type: bind
        source: ./mihomo/config.yaml
        target: /etc/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - mihomo_state:/var/lib/mihomo
    networks:
      wan:
        gw_priority: 100
      lan:
        ipv4_address: 10.77.0.2
        interface_name: lan0
    healthcheck:
      test: [CMD, /usr/local/bin/network, health-gateway]
      interval: 5s
      timeout: 3s
      retries: 8

  magpie-net-01: &magpie-net
    <<: *network-runtime
    command: [client]
    depends_on:
      mihomo:
        condition: service_healthy
    networks:
      lan:
        ipv4_address: 10.77.0.11
        interface_name: lan0
    healthcheck:
      test: [CMD, /usr/local/bin/network, health-client]
      interval: 5s
      timeout: 3s
      retries: 6

  magpie-01:
    <<: *magpie
    network_mode: service:magpie-net-01
    depends_on:
      magpie-net-01:
        condition: service_healthy
        restart: true
    volumes:
      - *resolver
      - type: bind
        source: ./magpie/01
        target: ${MAGPIE_CONFIG_DIR:?请在 .env 中设置 Magpie 镜像内的配置目录}
        read_only: true
        bind:
          create_host_path: false

  magpie-net-02:
    <<: *magpie-net
    networks:
      lan:
        ipv4_address: 10.77.0.12
        interface_name: lan0

  magpie-02:
    <<: *magpie
    network_mode: service:magpie-net-02
    depends_on:
      magpie-net-02:
        condition: service_healthy
        restart: true
    volumes:
      - *resolver
      - type: bind
        source: ./magpie/02
        target: ${MAGPIE_CONFIG_DIR:?请在 .env 中设置 Magpie 镜像内的配置目录}
        read_only: true
        bind:
          create_host_path: false

networks:
  wan:
    driver: bridge
    enable_ipv6: false
  lan:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      # 不让宿主机持有 .1，也不为这个桥配置出站伪装。
      com.docker.network.bridge.inhibit_ipv4: "true"
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1

volumes:
  mihomo_state:
