mode: rule
log-level: info
ipv6: false
allow-lan: true
bind-address: "*"
tproxy-port: 7893

dns:
  enable: false

# Magpie 的 DNS 和其他出站流量都按源 IP 走各自的 Shadowsocks 节点。
# 部署前替换地址、端口、加密方法和密码；服务端也必须启用 UDP。
proxies:
  - name: EXIT-A
    type: ss
    server: 192.0.2.11
    port: 8388
    cipher: aes-128-gcm
    password: "replace-with-exit-a-password"
    udp: true
  - name: EXIT-B
    type: ss
    server: 192.0.2.12
    port: 8388
    cipher: aes-128-gcm
    password: "replace-with-exit-b-password"
    udp: true

# 固定目标的 Web 管理转发。DIRECT 仅用于访问 LAN 上的这两个端口。
tunnels:
  - tcp,0.0.0.0:3431,10.77.0.11:3430,DIRECT
  - tcp,0.0.0.0:3432,10.77.0.12:3430,DIRECT

rules:
  - SRC-IP-CIDR,10.77.0.11/32,EXIT-A
  - SRC-IP-CIDR,10.77.0.12/32,EXIT-B
  - MATCH,REJECT
